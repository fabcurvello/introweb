<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Ex 19.3 - Sistema de Feedback</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      form {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        width: 300px;
      }
      input {
        margin-bottom: 10px;
        padding: 5px;
      }
      button {
        padding: 10px;
        cursor: pointer;
      }
      #mensagem-feedback {
        margin-top: 10px;
        font-weight: bold; /* negrito */
      }
    </style>
  </head>
  <body>
    <h2>Deixe seu Feedback sobre a Aula</h2>
    <!-- Formulário que será manipulado -->
    <form id="form-feedback">
      <label for="nome">Seu Nome:</label>
      <input type="text" id="nome" placeholder="Digite seu nome" />

      <label for="comentario">Comentário:</label>
      <input type="text" id="comentario" placeholder="O que achou da aula?" />

      <button type="submit" id="btn-enviar">Enviar Feedback</button>
    </form>

    <!-- Local onde a mensagem de erro ou sucesso vai aparecer -->
    <div id="mensagem-feedback">

    </div>

    <!-- Lista onde os feedbacks serão adicionados -->
    <h3>Comentários Recentes:</h3>
    <ul id="lista-comentarios">

    </ul>

    <script src="../js/exfeedbackform.js"></script>
  </body>
</html>
